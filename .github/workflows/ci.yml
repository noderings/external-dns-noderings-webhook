name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test -race ./...
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0

  image:
    name: Container image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: VERSION=ci

  e2e:
    name: End to end in kind (live API)
    # Calls the real NodeRings API. Runs when the NODERINGS_TOKEN secret is set,
    # on pushes and manual runs (never for pull requests from forks).
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: test
    env:
      NODERINGS_TOKEN: ${{ secrets.NODERINGS_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Run
        run: |
          if [ -z "$NODERINGS_TOKEN" ]; then echo "NODERINGS_TOKEN is not set; skipping."; exit 0; fi
          go install sigs.k8s.io/kind@v0.31.0
          docker build --build-arg VERSION=e2e -t ghcr.io/noderings/external-dns-noderings-webhook:e2e .
          hack/e2e.sh
